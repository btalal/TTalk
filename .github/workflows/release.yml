name: Release (APK Android + EXE Windows x64)

on:
  push:
    branches: [main, vibe/**]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64
        name: Compiler l'APK Android (arm64)
      - uses: actions/upload-artifact@v4
        with:
          name: ttalk-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publier l'APK en release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: TTalk ${{ github.ref_name }} — APK Android arm64
          body: APK release signé (debug keystore côté CI). Voir les notes de release pour l'installation.

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
        name: Compiler l'exécutable Windows x64
      - name: Zipper le dossier Release Windows
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ttalk-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ttalk-windows-x64
          path: build/windows/x64/runner/Release/
      - name: Publier le ZIP Windows en release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ttalk-windows-x64.zip
          name: TTalk ${{ github.ref_name }} — EXE Windows x64
          body: Exécutable Windows x64 (ttalk.exe + DLLs). Extraire le ZIP et lancer ttalk.exe.
