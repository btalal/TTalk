name: Release Windows 10/11 x64 (EXE)

on:
  push:
    branches:
      - 'vibe/talmessenger-e2e-5e4935'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows - EXE x64
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate packaging script
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/package-windows.ps1'), [ref]$tokens, [ref]$parseErrors) > $null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build Windows x64
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-windows.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            '### Windows build failure' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            Get-Content build-windows.log -Tail 100 >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
          exit $buildExit
      - name: Package and smoke-test Windows x64
        shell: pwsh
        run: |
          try {
            ./scripts/package-windows.ps1
          } catch {
            $message = $_.Exception.Message -replace "[\r\n]", ' '
            Write-Output "::error::$message"
            '### Windows packaging error' >> $env:GITHUB_STEP_SUMMARY
            '```text' >> $env:GITHUB_STEP_SUMMARY
            ($_ | Out-String) >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ttalk-windows-x64-${{ github.run_id }}
          path: |
            ttalk-windows-x64.zip
            ttalk-windows-x64.zip.sha256
          if-no-files-found: error
      - name: Create Windows Release (idempotent)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$VERSION_TAG-windows"
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GH_REPO" --target "${{ github.sha }}" --draft \
                 --title "TTalk $VERSION_TAG - Windows x64 (EXE)" \
                 --notes-file CHANGELOG.md
          gh release upload "$TAG" ttalk-windows-x64.zip ttalk-windows-x64.zip.sha256 --repo "$GH_REPO" --clobber
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest
