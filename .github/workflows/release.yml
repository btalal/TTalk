name: Release Windows 10/11 x64 (EXE)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release-windows:
    name: Windows - EXE x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter test
      - run: flutter build windows --release --target-platform windows-x64
      - name: Zip le dossier Release Windows
        shell: pwsh
        run: |
          $releasePath = "build/windows/x64/runner/Release"
          if (-not (Test-Path "$releasePath/ttalk.exe" -PathType Leaf)) {
            throw "Binaire ttalk.exe introuvable dans $releasePath"
          }
          Compress-Archive -Path "$releasePath/*" -DestinationPath ttalk-windows-x64.zip -Force
      - name: Create Windows Release (idempotent)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$VERSION_TAG-windows"
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GH_REPO" --target "${{ github.sha }}" \
                 --title "TTalk $VERSION_TAG - Windows x64 (EXE)" \
                 --notes "ttalk.exe + DLLs dans ttalk-windows-x64.zip. Extraire le ZIP et lancer ttalk.exe."
          gh release upload "$TAG" ttalk-windows-x64.zip --repo "$GH_REPO" --clobber
