name: Mobile Android and iOS preview

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop superseded mobile preview runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow mobile.yml --limit 30 --json databaseId,headSha,status > runs.json
          python3 -c 'import json,os; print("\n".join(str(r["databaseId"]) for r in json.load(open("runs.json")) if r["headSha"] != os.environ["GITHUB_SHA"] and r["status"] != "completed"))' > superseded.txt
          while IFS= read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then gh run cancel "$RUN_ID" || true; fi
          done < superseded.txt

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build release APK for external signing
        run: |
          set +e
          flutter build apk --release --no-pub 2>&1 | tee android-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            tail -80 android-build.log >> "$GITHUB_STEP_SUMMARY"
            python3 -c 'from pathlib import Path; s="\n".join(Path("android-build.log").read_text().splitlines()[-100:]); print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          fi
          exit "$BUILD_STATUS"
      - name: Stage unsigned Android package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ttalk-android-unsigned.apk
          cp docs/MOBILE_INSTALL.md dist/INSTALLATION.md
          (cd dist && sha256sum ttalk-android-unsigned.apk > ttalk-android-unsigned.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: dist/*
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native Android storage and mobile UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/run-mobile-test.py emulator-5554

  ios:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iPhone application
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package IPA for personal signing
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload dist/ttalk-ios-unsigned.ipa
          cp docs/MOBILE_INSTALL.md dist/INSTALLATION.md
          (cd dist && shasum -a 256 ttalk-ios-unsigned.ipa > ttalk-ios-unsigned.ipa.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*
      - name: Test Keychain and mobile UI on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          open -a Simulator --args -CurrentDeviceUDID "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 scripts/run-mobile-test.py "$DEVICE_ID"

  publish:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unsigned'
          merge-multiple: true
          path: dist
      - name: Publish mobile packages for signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOBILE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$MOBILE_TAG" --prerelease --latest=false --title "TTalk mobile — $MOBILE_TAG — archives à signer" --notes-file docs/MOBILE_INSTALL.md dist/*
