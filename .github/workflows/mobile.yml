name: Mobile Android and iOS packages

on:
  push:
    # vX.Y.Z-android / vX.Y.Z-preview.N-mobile sort with the other platforms of
    # the same version on the Releases page; the old prefixes stay accepted.
    tags: ['v*-android', 'v*-mobile', 'mobile-v*', 'android-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Stop superseded mobile preview runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run list --workflow mobile.yml --limit 30 --json databaseId,headSha,status,createdAt > runs.json
          python3 -c 'import json,os,datetime; cutoff=datetime.datetime.now(datetime.timezone.utc)-datetime.timedelta(minutes=15); print("\n".join(str(r["databaseId"]) for r in json.load(open("runs.json")) if r["headSha"] != os.environ["GITHUB_SHA"] and r["databaseId"] < int(os.environ["GITHUB_RUN_ID"]) and r["status"] != "completed" and datetime.datetime.fromisoformat(r["createdAt"].replace("Z","+00:00")) < cutoff))' > superseded.txt
          while IFS= read -r RUN_ID; do
            if [ -n "$RUN_ID" ]; then gh run cancel "$RUN_ID" || true; fi
          done < superseded.txt

  android:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm test --prefix server
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Reserve space for native Android builds
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h .
      - name: Install pinned Android native tools
        run: |
          SDK_MANAGER_PATH="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -f "$SDK_MANAGER_PATH"
          python3 scripts/run-logged.py "$SDK_MANAGER_PATH" "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
      # Native builds must regenerate plugin registrants for their build mode.
      # --no-pub skips that in Flutter 3.47.9 and leaves debug-only plugins behind.
      - name: Build release APK for external signing
        run: python3 scripts/run-logged.py flutter build apk --release
      - name: Stage unsigned Android package
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ttalk-android-unsigned.apk
          cp docs/MOBILE_INSTALL.md dist/INSTALLATION.md
          (cd dist && sha256sum ttalk-android-unsigned.apk > ttalk-android-unsigned.apk.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned
          path: dist/*
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native Android storage and mobile UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/run-mobile-test.py emulator-5554

  ios:
    if: ${{ !startsWith(github.ref, 'refs/tags/android-v') && !(startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-android')) }}
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iPhone application
        run: flutter build ios --release --no-codesign
      - name: Package IPA for personal signing
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/ditto -c -k --keepParent Payload dist/ttalk-ios-unsigned.ipa
          cp docs/MOBILE_INSTALL.md dist/INSTALLATION.md
          (cd dist && shasum -a 256 ttalk-ios-unsigned.ipa > ttalk-ios-unsigned.ipa.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: dist/*
      - name: Test Keychain and mobile UI on iPhone simulator
        run: |
          # The image's default Xcode offers no usable iOS Simulator destination,
          # and the newest Xcode may lack its iOS platform. Use the newest Xcode
          # with an *eligible* iOS Simulator destination for Runner; otherwise
          # download the iOS platform for the newest Xcode 26.
          eligible() {
            DEVELOPER_DIR="$1/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -q -- '-sdk iphonesimulator' &&
            DEVELOPER_DIR="$1/Contents/Developer" xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showdestinations 2>/dev/null \
              | awk '/Ineligible destinations/ {exit} {print}' | grep -q 'platform:iOS Simulator'
          }
          SELECTED=""
          for XCODE in $(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -rV); do
            echo "Essai de $XCODE"
            if eligible "$XCODE"; then SELECTED="$XCODE"; break; fi
          done
          if [ -z "$SELECTED" ]; then
            SELECTED=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
            echo "Aucun simulateur utilisable : téléchargement de la plateforme iOS pour $SELECTED"
            DEVELOPER_DIR="$SELECTED/Contents/Developer" xcodebuild -downloadPlatform iOS
          fi
          # Flutter follows xcode-select, not only DEVELOPER_DIR: switch both.
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          export DEVELOPER_DIR="$SELECTED/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'simulator' || true
          xcodebuild -project ios/Runner.xcodeproj -scheme Runner -showdestinations | awk '/Ineligible destinations/ {exit} {print}' | grep 'iOS Simulator' | head -n 3
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; v=lambda k: tuple(int(n) for n in re.findall(r"iOS-(\d+)-(\d+)", k)[0]) if re.search(r"iOS-\d+-\d+", k) else None; keys=sorted((k for k in d if v(k)), key=v, reverse=True); print(next(x["udid"] for k in keys for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulateur : $DEVICE_ID"
          # Configure Flutter and CocoaPods before any simulator starts: once the
          # default Simulator app boots a device, xcodebuild no longer lists the
          # iOS Simulator destinations. xcodebuild test boots the device itself.
          mkdir -p build
          if ! flutter build ios --config-only --debug --simulator --target integration_test/mobile_smoke_test.dart -v > build/flutter-ios-config.log 2>&1; then
            grep -n -i -E 'error|unable|xcodebuild' build/flutter-ios-config.log | tail -n 40
            tail -n 40 build/flutter-ios-config.log
            exit 1
          fi
          (cd ios && pod install)
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 scripts/run-logged.py xcodebuild test \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/ios/native-tests \
            -resultBundlePath build/ios/mobile-tests.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=-
          xcrun xcresulttool get test-results summary --path build/ios/mobile-tests.xcresult > build/ios/mobile-test-summary.json
          python3 -c 'import json; s=json.load(open("build/ios/mobile-test-summary.json")); print(s); assert s.get("passedTests", 0) >= 1 and s.get("failedTests", 0) == 0, "Aucun test Dart natif réussi"'

  publish:
    if: ${{ always() && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/android-v') || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-android')) || ((startsWith(github.ref, 'refs/tags/mobile-v') || (startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '-mobile'))) && needs.ios.result == 'success')) }}
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unsigned'
          merge-multiple: true
          path: dist
      - name: Publish mobile packages for signing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MOBILE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$MOBILE_TAG" == android-v* || "$MOBILE_TAG" == v*-android ]]; then
            gh release create "$MOBILE_TAG" --prerelease --latest=false --title "TTalk Android — $MOBILE_TAG — signature en cours" --notes-file docs/ANDROID_RELEASE.md dist/*
          else
            gh release create "$MOBILE_TAG" --prerelease --latest=false --title "TTalk mobile — $MOBILE_TAG — archives à signer" --notes-file docs/MOBILE_INSTALL.md dist/*
          fi
