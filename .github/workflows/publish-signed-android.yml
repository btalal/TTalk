name: Publish offline-signed Android packages

on:
  push:
    branches: ['main/ttalk']
    paths:
      - 'release-signatures/**'
      - 'scripts/apply-android-signature.py'
      - 'scripts/publish-signed-android.sh'
      - 'scripts/run-logged.py'
      - '.github/workflows/publish-signed-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-signed-android
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install standard binary patch utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bsdiff
      - name: Verify and publish signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/run-logged.py bash scripts/publish-signed-android.sh
