name: Update stable release presentation

on:
  push:
    branches: ['main/ttalk']
    paths:
      - 'docs/releases/**'
      - 'docs/ANDROID_RELEASE.md'
      - '.github/workflows/release-presentation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-presentation
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Clarify Windows and Android stable releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit v0.5.0-windows \
            --title '🖥️ Windows x64 — TTalk 0.5.0 · Version stable' \
            --notes-file docs/releases/windows-0.5.0.md
          gh release edit android-v0.5.0 \
            --title '📱 Android — TTalk 0.5.0 · Version stable' \
            --notes-file docs/ANDROID_RELEASE.md
