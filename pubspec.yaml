name: ttalk
description: TTalk - simple and encrypted messages — messagerie texte chiffrée de bout en bout pour Windows 10/11 x64.
publish_to: "none"
platforms:
  windows:
version: 0.4.0-rc.4+12

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  web_socket_channel: ^3.0.1
  uuid: ^4.4.1
  intl: ^0.19.0
  convert: ^3.1.1
  crypto: ^3.0.3
  file_picker: ^10.1.6
  path_provider: ^2.1.4
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/ttalk.png
