app = "ttalk"
primary_region = "cdg"
# Filet de sécurité si la mémoire de 256 Mo est ponctuellement dépassée.
swap_size_mb = 256

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"
  # Garde le tas JavaScript sous la mémoire de la machine (256 Mo).
  NODE_OPTIONS = "--max-old-space-size=160"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[mounts]
  source = "ttalk_messages"
  destination = "/data"
  initial_size = "1GB"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256MB"
