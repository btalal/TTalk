# fly.toml app configuration file generated for ttalk on 2026-11-04T07:57:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ttalk'
primary_region = 'cdg'

[build]

[env]
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  PORT = '8080'

[[mounts]]
  source = 'ttalk_messages'
  destination = '/data'
  initial_size = '1GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512MB'
